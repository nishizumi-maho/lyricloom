name: Bug report
description: Something is broken or produces wrong timing
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not attach copyrighted audio or lyrics. A short synthetic sample or a description is enough.
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which product has the problem?
      options:
        - LyricLoom app
        - Starry Karaoke plugin (MusicBee)
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: LyricLoom version (Help > About or `lyricloom --version`) and/or Starry Karaoke version (MusicBee plugin list).
      placeholder: "LyricLoom 2.1.0 / Starry Karaoke 1.3.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Windows with WSL/ROCm
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact steps and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        For the LyricLoom app, paste **Help > Diagnostics…** (copy the text).
        For the Starry Karaoke plugin, paste **Diagnostics** from its settings or window menu.
        Remove personal paths if you prefer. The text never includes the AssemblyAI key or lyrics.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        For a single song, the relevant `log.txt` from the work cache (open it from the library row menu).
        For the app or updater, the tail of `%LOCALAPPDATA%\LyricLoom\logs\app.log`.
        For the plugin, the relevant part of `mb_StarryKaraoke.log` next to the plugin DLL.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using the latest release.
        - label: I searched existing issues.
