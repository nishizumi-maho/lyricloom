name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      plugin_version: ${{ steps.plugin.outputs.plugin_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' lyricloom/__init__.py | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read VERSION from lyricloom/__init__.py." >&2
            exit 1
          fi
          PYPROJECT_VERSION="$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          if [[ "$PYPROJECT_VERSION" != "$VERSION" ]]; then
            echo "pyproject.toml version ${PYPROJECT_VERSION} does not match lyricloom.VERSION=${VERSION}." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match lyricloom.VERSION=${VERSION}." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building LyricLoom $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Read plugin version
        id: plugin
        shell: bash
        run: |
          PLUGIN_VERSION="$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('musicbee/src/StarryKaraoke/StarryKaraoke.csproj').getroot().findtext('PropertyGroup/Version') or '')")"
          if [[ -z "$PLUGIN_VERSION" ]]; then
            echo "Could not read <Version> from musicbee/src/StarryKaraoke/StarryKaraoke.csproj." >&2
            exit 1
          fi
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Starry Karaoke for MusicBee $PLUGIN_VERSION" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows installer and portable zip
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "torch==2.4.1" "torchaudio==2.4.1" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Fetch prebuilt whisper.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/ggerganov/whisper.cpp/releases/download/v1.9.2/whisper-bin-x64.zip'
          $expectedSha256 = '49dcc16de826f20bd53d44f947a1ae49dfa81f86cad67a64d80820cb192d674a'
          $expectedSize = 8194445
          $zip = Join-Path $env:RUNNER_TEMP 'whisper-bin-x64.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'whisper-bin-x64'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actualSize = (Get-Item -LiteralPath $zip).Length
          if ($actualSize -ne $expectedSize) {
            throw "whisper-bin-x64.zip size mismatch: expected $expectedSize bytes, got $actualSize."
          }
          $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "whisper-bin-x64.zip SHA-256 mismatch: expected $expectedSha256, got $actualSha256."
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          New-Item -ItemType Directory -Force 'tools\bin' | Out-Null
          Get-ChildItem -LiteralPath $dir -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Copy-Item -Destination 'tools\bin' -Force
          if (-not (Test-Path -PathType Leaf 'tools\bin\whisper-cli.exe')) {
            throw 'whisper-cli.exe was not found in the prebuilt archive.'
          }

      - name: Build Windows release
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -SkipWhisper

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'dist\LyricLoom\LyricLoom.exe')) {
            throw 'The PyInstaller GUI executable is missing.'
          }
          if (-not (Test-Path 'dist\LyricLoom\LyricLoomWorker.exe')) {
            throw 'The PyInstaller worker executable is missing.'
          }
          if (-not (Test-Path -PathType Leaf 'dist\LyricLoom\_internal\tools\bin\whisper-cli.exe')) {
            throw 'The bundled whisper-cli.exe is missing.'
          }
          if (-not (Test-Path 'dist\LyricLoom-Setup.exe')) {
            throw 'The stable LyricLoom-Setup.exe is missing.'
          }
          if (-not (Get-ChildItem dist -Filter 'LyricLoom-Setup-*.exe')) {
            throw 'The versioned Setup executable is missing.'
          }
          if (-not (Get-ChildItem dist -Filter 'LyricLoom-*-win64.zip')) {
            throw 'The portable zip is missing.'
          }
          if (-not (Get-ChildItem dist -Filter '*.sha256')) {
            throw 'The SHA256 files are missing.'
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            dist/LyricLoom-Setup.exe
            dist/LyricLoom-Setup-*.exe
            dist/LyricLoom-*-win64.zip
            dist/*.sha256

  linux:
    name: Linux tarball
    needs: validate
    # Build on the older LTS runner so the PyInstaller binary works on a wider
    # range of glibc versions than the latest Ubuntu runner would allow.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git patchelf binutils \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libsndfile1 libpulse0 libfontconfig1 ffmpeg

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "torch==2.4.1" "torchaudio==2.4.1" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Build Linux release
        shell: bash
        run: bash scripts/build-linux.sh

      - name: Verify Linux artifacts
        shell: bash
        run: |
          ls -lh dist
          test -f dist/LyricLoom/LyricLoom
          test -f dist/LyricLoom/LyricLoomWorker
          test -f dist/LyricLoom/_internal/tools/bin/whisper-cli
          compgen -G "dist/LyricLoom-*-linux-x86_64.tar.gz" >/dev/null
          compgen -G "dist/LyricLoom-*-linux-x86_64.tar.gz.sha256" >/dev/null

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-tarball
          if-no-files-found: error
          path: |
            dist/LyricLoom-*-linux-x86_64.tar.gz
            dist/LyricLoom-*-linux-x86_64.tar.gz.sha256

  musicbee:
    name: MusicBee plugin
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the plugin release zip
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File musicbee/build.ps1

      - name: Write the plugin checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.validate.outputs.plugin_version }}'
          $zip = Join-Path 'musicbee\dist' "StarryKaraoke-MusicBee-$version.zip"
          if (-not (Test-Path -PathType Leaf $zip)) {
            throw "The plugin release zip was not produced at $zip."
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path -Leaf $zip
          [System.IO.File]::WriteAllText(
            "$zip.sha256",
            "$hash  $name`n",
            (New-Object System.Text.ASCIIEncoding)
          )

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: musicbee-plugin
          if-no-files-found: error
          path: |
            musicbee/dist/StarryKaraoke-MusicBee-*.zip
            musicbee/dist/StarryKaraoke-MusicBee-*.zip.sha256

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - windows
      - linux
      - musicbee
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify and aggregate checksums
        shell: bash
        run: |
          cd release-assets
          ls -lh
          shopt -s nullglob
          # Windows-created checksum files may arrive with CRLF; normalize them.
          sed -i 's/\r$//' ./*.sha256
          for file in *.sha256; do
            sha256sum -c "$file"
          done
          cat *.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: LyricLoom ${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}

