name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' lyricloom/__init__.py | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read VERSION from lyricloom/__init__.py." >&2
            exit 1
          fi
          PYPROJECT_VERSION="$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          if [[ "$PYPROJECT_VERSION" != "$VERSION" ]]; then
            echo "pyproject.toml version ${PYPROJECT_VERSION} does not match lyricloom.VERSION=${VERSION}." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match lyricloom.VERSION=${VERSION}." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building LyricLoom $VERSION" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows installer and portable zip
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "torch==2.4.1" "torchaudio==2.4.1" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows release
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'dist\LyricLoom\LyricLoom.exe')) {
            throw 'The PyInstaller GUI executable is missing.'
          }
          if (-not (Test-Path 'dist\LyricLoom\LyricLoomWorker.exe')) {
            throw 'The PyInstaller worker executable is missing.'
          }
          if (-not (Test-Path 'dist\LyricLoom\_internal\tools\bin\whisper-cli.exe')) {
            throw 'The bundled whisper-cli.exe is missing.'
          }
          if (-not (Test-Path 'dist\LyricLoom-Setup.exe')) {
            throw 'The stable LyricLoom-Setup.exe is missing.'
          }
          if (-not (Get-ChildItem dist -Filter 'LyricLoom-Setup-*.exe')) {
            throw 'The versioned Setup executable is missing.'
          }
          if (-not (Get-ChildItem dist -Filter 'LyricLoom-*-win64.zip')) {
            throw 'The portable zip is missing.'
          }
          if (-not (Get-ChildItem dist -Filter '*.sha256')) {
            throw 'The SHA256 files are missing.'
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            dist/LyricLoom-Setup.exe
            dist/LyricLoom-Setup-*.exe
            dist/LyricLoom-*-win64.zip
            dist/*.sha256

  linux:
    name: Linux tarball
    needs: validate
    # Build on the older LTS runner so the PyInstaller binary works on a wider
    # range of glibc versions than the latest Ubuntu runner would allow.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git patchelf binutils \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libsndfile1 libpulse0 libfontconfig1 ffmpeg

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "torch==2.4.1" "torchaudio==2.4.1" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Build Linux release
        shell: bash
        run: bash scripts/build-linux.sh

      - name: Verify Linux artifacts
        shell: bash
        run: |
          ls -lh dist
          test -f dist/LyricLoom/LyricLoom
          test -f dist/LyricLoom/LyricLoomWorker
          test -f dist/LyricLoom/_internal/tools/bin/whisper-cli
          compgen -G "dist/LyricLoom-*-linux-x86_64.tar.gz" >/dev/null
          compgen -G "dist/LyricLoom-*-linux-x86_64.tar.gz.sha256" >/dev/null

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          if-no-files-found: error
          path: |
            dist/LyricLoom-*-linux-x86_64.tar.gz
            dist/LyricLoom-*-linux-x86_64.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - windows
      - linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify and aggregate checksums
        shell: bash
        run: |
          cd release-assets
          ls -lh
          shopt -s nullglob
          # Windows-created checksum files may arrive with CRLF; normalize them.
          sed -i 's/\r$//' ./*.sha256
          for file in *.sha256; do
            sha256sum -c "$file"
          done
          cat *.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: LyricLoom ${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
