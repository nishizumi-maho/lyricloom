[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricloom"
version = "2.1.0"
description = "Word-by-word synced .lrc lyrics from official lyrics, aligned against isolated vocals."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "LyricLoom contributors" }]
keywords = ["lyrics", "karaoke", "lrc", "forced-alignment", "musicbee", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "torch==2.4.1",
    "torchaudio==2.4.1",
    "audio-separator[cpu]>=0.40",
    "imageio-ffmpeg",
    "mutagen",
    "fugashi",
    "ipadic",
    "pykakasi",
    "rapidfuzz",
    "soundfile",
    "soxr",
    "httpx",
    "beautifulsoup4",
    "PySide6>=6.7,<6.9",
    # LyricsAlignment-MTL inference (vendored). g2p_en pulls the NLTK data used for English.
    "g2p_en",
    "nltk",
    "inflect",
    "unidecode",
    "librosa",
    "resampy",
    "samplerate",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "sounddevice", "pyinstaller>=6.10", "ruff"]

[project.scripts]
lyricloom = "lyricloom.cli:main"

[project.gui-scripts]
lyricloom-app = "lyricloom.app.main:run"

[project.urls]
Homepage = "https://github.com/nishizumi-maho/lyricloom"
Documentation = "https://github.com/nishizumi-maho/lyricloom/tree/main/docs"
Issues = "https://github.com/nishizumi-maho/lyricloom/issues"
Releases = "https://github.com/nishizumi-maho/lyricloom/releases"

[tool.setuptools.packages.find]
include = ["lyricloom*"]

[tool.setuptools.package-data]
lyricloom = ["assets/*"]
"lyricloom.vendor.mtl" = ["*.py", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = [
    "gpu: needs real models, a GPU toolchain or the WSL distro (deselected by default)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
